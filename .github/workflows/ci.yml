name: CI Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-checks:
    name: Test & Lint Backend (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check Python Syntax
        run: |
          if [ -d backend ]; then python -m compileall backend/; fi

  frontend-checks:
    name: Test & Lint Frontend (Node)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install                           # Runs at project root where package.json lives

      - name: Build Frontend
        run: npm run build --if-present            # Runs at project root

  podman-build:
    name: Container Build Check (Podman)
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Podman Installation
        run: podman version

      - name: Build Container with Podman
        run: |
          if [ -f Dockerfile.frontend ]; then
            echo "Building frontend container..."
            podman build -t xenocurator-frontend:ci -f Dockerfile.frontend .
          elif [ -f backend/Dockerfile ]; then
            echo "Building backend container..."
            podman build -t xenocurator-backend:ci -f backend/Dockerfile .
          elif [ -f Dockerfile ]; then
            echo "Building root Dockerfile..."
            podman build -t xenocurator:ci -f Dockerfile .
          else
            echo "No Dockerfile found yet. Skipping podman build step gracefully!"
          fi
