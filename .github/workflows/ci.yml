name: CI Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-checks:
    name: Test & Lint Backend (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Optional: Add pytest or linters here once you have them
      - name: Check Python Syntax
        run: |
          python -m compileall backend/

  frontend-checks:
    name: Test & Lint Frontend (Node)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then npm ci || npm install; fi

      - name: Build Frontend
        run: |
          if [ -f package.json ]; then npm run build --if-present; fi

  podman-build:
    name: Container Build Check (Podman)
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Podman Installation
        run: podman version

      # Builds using backend/Dockerfile if present, otherwise outputs a placeholder test
      - name: Build Container with Podman
        run: |
          if [ -f backend/Dockerfile ]; then
            podman build -t xenocurator-backend:ci -f backend/Dockerfile .
          elif [ -f Dockerfile ]; then
            podman build -t xenocurator:ci -f Dockerfile .
          else
            echo "No Dockerfile found yet. Skipping podman build step gracefully!"
          fi
